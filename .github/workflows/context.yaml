name: Contexts

on:
    workflow_dispatch:

env:
    MY_WORKFLOW: 'workflow'
    MY_OVERWRITTEN_VAR: 'workflow'

jobs:
    echo-data:
        runs-on: ubuntu-latest
        env:
            MY_JOB_VAR: 'job'
            MY_OVERWRITTEN_VAR: 'job'
        steps:
            - name: Display information
              run: |
                    echo "Event Name: ${{ github.workflow }}"
                    echo "Ref: ${{ github.job }}"
                    echo "SHA: ${{ github.step }}"
                    echo "Actor: ${{ github.actor }}"
                    echo "Workflow: ${{ github.workflow }}"
                    echo "Repository: ${{ github.repository }}"
                    echo "Run ID: ${{ github.run_id }}"
                    echo "Run Number: ${{ github.run_number }}"
                    echo "Job Name: ${{ github.job }}"

            - name: Retreive variable values
              run: |
                    echo "Variable value: ${{ vars.MY_VAR }}"

                            - name: Display environment variables
                              env:
                                  MY_OVERWRITTEN_VAR: 'step'
                              run: |
                                    echo "MY_WORKFLOW_VAR: $MY_WORKFLOW_VAR"
                                    echo "MY_JOB_VAR: $MY_JOB_VAR"
                                    echo "MY_OVERWRITTEN_VAR: $MY_OVERWRITTEN_VAR"
            - name: Display environment variables
              run: |
                    echo "MY_WORKFLOW_VAR: $MY_WORKFLOW_VAR"
                    echo "MY_JOB_VAR: $MY_JOB_VAR"
                    echo "MY_OVERWRITTEN_VAR: $MY_OVERWRITTEN_VAR"
    echo-data-2:
        runs-on: ubuntu-latest
        steps:
            - name: Display environmental variables
              run: |
                    echo "MY_WORKFLOW_VAR: $MY_WORKFLOW_VAR"
                    echo "MY_JOB_VAR: $MY_JOB_VAR"
                    echo "MY_OVERWRITTEN_VAR: $MY_OVERWRITTEN_VAR"
                    
                   